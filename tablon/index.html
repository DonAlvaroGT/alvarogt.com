<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Tablón</title>
<!-- tablon-build: 20260928e-priv -->
<style>:root{color-scheme:light;--ink:#17324d;--muted:#64748b;--card:#fff;--line:#e5dfd1;--ok:#16834b;--ok-bg:#e9f8ef;--no:#c62828;--no-bg:#fff0f0;--shadow:0 12px 30px #17324d14}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7efe1,#e9f3f4);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{width:min(1160px,calc(100% - 28px));margin:auto}.top{padding:28px 0 24px;display:flex;justify-content:space-between;gap:18px;align-items:end}
.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:#e76f51;font-weight:800}
.top h1{font:400 clamp(2.7rem,8vw,5.8rem)/.9 Georgia,serif;letter-spacing:-.065em;margin:12px 0 0}
.demo{background:#fff4ce;border:1px solid #f0d685;color:#745b16;border-radius:999px;padding:9px 13px;font-size:.76rem;white-space:nowrap;cursor:pointer;font:inherit}
.access-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.access-status{color:var(--muted);font-size:.76rem}
.child-login{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:14px}
.child-login[hidden]{display:none}.child-login label{display:grid;gap:4px;font-size:.72rem;color:var(--muted)}
.child-login input{width:180px;padding:8px;border:1px solid var(--line);border-radius:8px}
.approve{background:var(--ok-bg);border:1px solid #8bd2a8;color:var(--ok);border-radius:999px;padding:9px 13px;font:inherit;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:999px;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
html.embedded #google-sign-out,html.embedded #google-sign-in,html.embedded #child-sign-in,html.embedded #child-login{display:none!important}
#board-root[hidden]{display:none!important}
@media(max-width:560px){.top{flex-direction:column;align-items:start}.access-row .demo{margin-top:0}}</style>
</head>
<body>
<header class="shell top"><div><div class="eyebrow">Casa · Tablón familiar</div><h1>Tablón</h1></div><div style="display:flex;flex-direction:column;align-items:end;gap:8px"><div class="access-row"><span id="google-status" class="access-status">Acceso · comprobando</span><button id="google-sign-in" class="demo" type="button">Adultos</button><button id="child-sign-in" class="demo" type="button">Niños</button><button id="google-sign-out" class="demo" type="button" hidden>Salir</button></div><form id="child-login" class="child-login" hidden><label>Correo <input id="child-email" type="email" required></label><label>Contraseña <input id="child-password" type="password" required></label><button class="approve" type="submit">Entrar</button></form></div></header>
<div id="board-root" hidden></div>
<footer class="shell" style="padding:28px 0 36px;color:var(--muted);font-size:.8rem">Creado por Álvaro GT y sus minions</footer>
<div id="toast" class="toast" role="status"></div>
<script type="module">
const BUILD = '20260928e-priv';
const embedded = (() => { try { return window.parent !== window && window.parent.location.origin === location.origin; } catch { return false; } })();
if (embedded) document.documentElement.classList.add('embedded');
function parentEmail() { if (!embedded) return ''; try { return String(window.parent.__casaAuth?.email?.() || '').toLowerCase(); } catch { return ''; } }
function parentOk() { if (!embedded) return false; try { return !!window.parent.__casaAuth?.ok?.(); } catch { return false; } }
let authApi, authService, functionsApi, functionsClient, boardMod = null;
const status = document.querySelector('#google-status'), signIn = document.querySelector('#google-sign-in'), childSignIn = document.querySelector('#child-sign-in'), childLogin = document.querySelector('#child-login'), childEmail = document.querySelector('#child-email'), childPassword = document.querySelector('#child-password'), signOut = document.querySelector('#google-sign-out');
const hideEmbeddedChrome = () => { if (!embedded) return; signIn.hidden = true; signOut.hidden = true; childSignIn.hidden = true; childLogin.hidden = true; };
const hideBoard = () => { boardMod?.unmount?.(); document.title = 'Tablón'; const h = document.querySelector('.top h1'); if (h) h.textContent = 'Tablón'; };
window.tablonRemoteCall = async (name, item) => {
  if (!authService?.currentUser || !functionsClient) throw new Error('Sesión no autenticada.');
  await authApi.getIdToken(authService.currentUser, true);
  const eventId = crypto.randomUUID();
  if (name === 'requestRedemption') return functionsApi.httpsCallable(functionsClient, name)({ rewardId: item.id, eventId });
  if (name === 'validateRedemption' || name === 'rejectRedemption') return functionsApi.httpsCallable(functionsClient, name)({ redemptionId: item.redemptionId, eventId });
  return functionsApi.httpsCallable(functionsClient, name)({ taskId: item.id, eventId, ...(window.tablonBoardDay === 'yesterday' ? { period: 'yesterday' } : {}) });
};
const remoteMode = () => !!authService?.currentUser && !!functionsClient;
window.tablonRemoteMode = remoteMode;
window.tablonCatalogCall = (collection, operation, id, payload) => {
  if (!remoteMode()) throw new Error('Sesión adulta necesaria.');
  return functionsApi.httpsCallable(functionsClient, 'manageCatalog')({ collection, operation, id, payload });
};
const setStatus = (text) => { status.textContent = text; };
const setSignedIn = (user, role) => {
  window.tablonAdult = role === 'adult';
  window.tablonChild = role === 'child';
  if (role !== 'adult' && typeof window.tablonSetBoardDay === 'function') window.tablonSetBoardDay('today');
  setStatus((role === 'adult' ? 'Adulto · ' : 'Niños · ') + (user.displayName || user.email || 'cuenta'));
  signIn.hidden = !!user;
  childSignIn.hidden = embedded;
  signOut.hidden = embedded || !user;
  childLogin.hidden = true;
  hideEmbeddedChrome();
  window.tablonRender?.();
};
childSignIn.addEventListener('click', async () => {
  if (embedded) return;
  if (authService?.currentUser) { await authApi.signOut(authService); }
  childLogin.hidden = !childLogin.hidden;
  if (!childLogin.hidden) { setStatus('Niños · introduce el correo y la contraseña'); childEmail.focus(); }
});
childLogin.addEventListener('submit', async e => {
  e.preventDefault();
  if (!authApi || !authService) { setStatus('Niños · Firebase aún está cargando'); return; }
  try {
    setStatus('Niños · entrando…');
    await authApi.signInWithEmailAndPassword(authService, childEmail.value.trim().toLowerCase(), childPassword.value);
    childPassword.value = '';
  } catch (err) {
    console.error('child login', err);
    const messages = { 'auth/invalid-credential': 'correo o contraseña incorrectos', 'auth/user-not-found': 'cuenta no encontrada', 'auth/wrong-password': 'contraseña incorrecta', 'auth/too-many-requests': 'demasiados intentos; espera un poco' };
    setStatus('Niños · ' + (messages[err.code] || err.code || 'no se pudo entrar'));
  }
});
async function setupGoogle() {
  if (!['localhost', 'alvarogt.com', 'www.alvarogt.com', 'tablongo.web.app', 'tablongo.firebaseapp.com'].includes(location.hostname)) {
    setStatus('Acceso · dominio no autorizado');
    return;
  }
  try {
    const config = await fetch('./firebase.public.json').then(r => r.json());
    const [{ initializeApp }, auth, firestore, functions] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js')
    ]);
    const app = initializeApp(config);
    authApi = auth;
    authService = auth.getAuth(app);
    await auth.setPersistence(authService, auth.browserLocalPersistence);
    functionsApi = functions;
    functionsClient = functions.getFunctions(app, 'europe-west1');
    const service = authService, provider = new auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    window.tablonFirebase = { app, auth: service, firestore: firestore.getFirestore(app), functions: functionsClient, api: firestore };
    const enterFromParent = () => { if (!parentOk()) return false; hideEmbeddedChrome(); setStatus(parentEmail()); return true; };
    const applyUser = async user => {
      try {
        const { claims } = await user.getIdTokenResult(true);
        const isChild = claims.childRole === 'supervised';
        boardMod = await import('./board.js?v=' + BUILD);
        await boardMod.mount({ user, claims, setStatus });
        setSignedIn(user, isChild ? 'child' : 'adult');
      } catch (error) {
        console.error('tablon auth', error);
        auth.signOut(service);
        window.tablonAdult = false;
        window.tablonChild = false;
        hideBoard();
        setStatus('Cuenta no autorizada');
        window.tablonRender?.();
      }
    };
    auth.onAuthStateChanged(service, user => {
      if (!user) {
        window.tablonAdult = false;
        window.tablonChild = false;
        if (typeof window.tablonSetBoardDay === 'function') window.tablonSetBoardDay('today');
        hideBoard();
        if (enterFromParent()) { window.tablonRender?.(); return; }
        setStatus('Acceso · sin sesión');
        signIn.hidden = false;
        childSignIn.hidden = false;
        signOut.hidden = true;
        window.tablonRender?.();
        return;
      }
      void applyUser(user);
    });
    if (auth.authStateReady) await auth.authStateReady(service);
    if (!service.currentUser) enterFromParent();
    signIn.addEventListener('click', async () => {
      if (embedded && parentOk()) return;
      try {
        setStatus('Google · entrando…');
        await auth.signInWithPopup(service, provider);
      } catch (e) {
        console.error('adult login', e);
        if (enterFromParent()) return;
        setStatus('Google · ' + (e.code || 'error'));
      }
    });
    signOut.addEventListener('click', () => { if (embedded) return; auth.signOut(service); });
  } catch (e) {
    console.error('Firebase setup', e);
    setStatus('Acceso · configuración no disponible');
  }
}
setupGoogle();
</script></body></html>
