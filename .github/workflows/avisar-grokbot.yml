name: Avisar a Grok Bot

on:
  push:
    branches: [main]
    paths:
      - 'sincro/novedades-hermes.md'

jobs:
  aviso-grokbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Avisar a Grok Bot
        run: |
          curl -X POST "${{ secrets.GROKBOT_WEBHOOK }}"             -H "Authorization: Bearer ${{ secrets.GROKBOT_WEBHOOK_AUTH }}"             -H "Content-Type: application/json"             -d '{
              "type": "novedades-hermes",
              "message": "Nuevas novedades en sincro/novedades-hermes.md"
            }'
        env:
          GROKBOT_WEBHOOK: ${{ secrets.GROKBOT_WEBHOOK }}
          GROKBOT_WEBHOOK_AUTH: ${{ secrets.GROKBOT_WEBHOOK_AUTH }}
