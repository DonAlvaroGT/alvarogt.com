name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run all tests
        run: node --test go/*.mjs tablon/*.test.mjs tablon/test/*.test.mjs casa/*.mjs mapa/*.mjs plantas/*.mjs
      - name: Run Python tests
        run: |
          python3 -m unittest -v test_pie.py casa/test_casa.py mapa/test_mapa.py plantas/test_plantas.py
          python3 -m unittest discover -v -s go -p 'test_*.py'
          python3 -m unittest discover -v -s viajes -p 'test_*.py'
