<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>G.O.</title>
  <!-- go-build: 20261007a -->
  <style>
    :root {
      color-scheme: light;
      --ink: #18263a;
      --ink-soft: #526174;
      --navy: #223c5c;
      --blue: #3a6b9e;
      --sky: #edf4fa;
      --cream: #fbfaf7;
      --paper: #ffffff;
      --line: #dbe3eb;
      --gold: #ad7b27;
      --shadow: 0 18px 50px rgba(31, 54, 78, .08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; scroll-behavior: smooth; }
    body {
      background: linear-gradient(180deg, #edf5fb 0%, #f8fbfd 28%, var(--cream) 52%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(980px, calc(100% - 36px)); margin: auto; }
    header {
      min-height: 38vh;
      padding: 24px 0 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .kicker, .source, .stamp {
      font-size: .7rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      color: var(--navy);
      font: 400 clamp(3.5rem, 12vw, 8.5rem)/.84 Georgia, "Times New Roman", serif;
      letter-spacing: -.075em;
      margin: 0;
      max-width: 800px;
    }
    .intro { max-width: 500px; color: var(--ink-soft); line-height: 1.5; margin: 22px 0 0; }
    .clock { font-variant-numeric: tabular-nums; color: var(--navy); font-size: .78rem; }
    .header-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 26px; }
    .header-actions .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .agenda-link, button.demo {
      align-self: flex-start;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--navy);
      background: var(--paper);
      font: inherit;
      font-size: .82rem;
      text-decoration: none;
      cursor: pointer;
    }
    button.demo[hidden] { display: none; }
    .agenda-link:hover, .agenda-link:focus, button.demo:hover { background: var(--sky); color: var(--navy); }
    .access-status { color: var(--ink-soft); font-size: .76rem; }
    #gate[hidden], #app[hidden] { display: none; }
    #gate { min-height: 36vh; display: grid; place-items: center; text-align: center; padding: 48px 16px; }
    #gate h2 { color: var(--navy); font: 400 2.4rem/1 Georgia, serif; margin: 0 0 12px; }
    #gate p { color: var(--ink-soft); max-width: 420px; margin: 0 auto 22px; line-height: 1.55; }
    main { padding: 38px 0 70px; }
    .vista-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: var(--paper);
    }
    .vista-switch button {
      border: 0;
      background: transparent;
      color: var(--navy);
      padding: 8px 16px;
      font: inherit;
      font-size: .82rem;
      cursor: pointer;
    }
    .vista-switch button[aria-pressed="true"] {
      background: var(--navy);
      color: #fff;
    }
    .days { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .days.is-week { grid-template-columns: 1fr; }
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      min-height: 350px;
      padding: 24px;
    }
    .date { color: var(--gold); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
    .day-name { color: var(--navy); font: 400 2.2rem/1 Georgia, serif; margin: 34px 0 20px; }
    .viaje { color: var(--gold); font-size: .86rem; line-height: 1.45; margin: -8px 0 16px; }
    .copy { color: var(--ink-soft); line-height: 1.65; margin: 0; }
    .copy strong { color: var(--navy); font-weight: 500; }
    .activities { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink); line-height: 1.6; }
    .comedor { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .comedor ul { margin: 8px 0 0; padding-left: 1.15em; color: var(--ink); line-height: 1.55; }
    .empty { color: var(--ink-soft); }
    footer { margin-top: 26px; color: var(--ink-soft); font-size: .73rem; line-height: 1.5; border-top: 1px solid var(--line); padding: 18px 0 0; }
    .error { padding: 24px; border: 1px solid #e3c4c4; color: #8a3030; background: #fff6f6; }
    @media (max-width: 650px) {
      .wrap { width: min(100% - 28px, 980px); }
      header { min-height: 42vh; }
      .days, .days.is-week { grid-template-columns: 1fr; }
      article { min-height: 0; }
      .day-name { margin-top: 24px; }
    }
    html.embedded header { min-height: 0; padding: 16px 0 18px; }
    html.embedded h1 { font-size: clamp(2.1rem, 9vw, 3.4rem); }
    html.embedded .intro { margin-top: 10px; }
    html.embedded #gate { min-height: 0; padding: 28px 16px; }
    html.embedded .header-actions { margin-top: 14px; }
    html.embedded .header-actions .row:first-of-type { display: none; }
    @media (min-width: 651px) {
      .days.is-week { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="kicker">Casa · Madrid</div>
    <div><h1>G.O.</h1><p class="intro"><span id="updated">Actualizado: —</span></p></div>
    <div class="clock" id="clock">—</div>
    <div class="header-actions">
      <div class="row">
        <span id="google-status" class="access-status">Acceso · comprobando</span>
        <button id="google-sign-in" class="demo" type="button">Entrar</button>
        <button id="google-sign-out" class="demo" type="button" hidden>Salir</button>
      </div>
      <div class="row vista-switch" role="group" aria-label="Vista">
        <button type="button" id="vista-hoy" data-vista="hoy" aria-pressed="true">Hoy</button>
        <button type="button" id="vista-semana" data-vista="semana" aria-pressed="false">Semana</button>
        <button type="button" id="vista-proxima" data-vista="proxima" aria-pressed="false">Próxima</button>
      </div>
    </div>
  </header>
  <section id="gate" class="wrap">
    <div>
      <div class="kicker">Casa · GO</div>
      <h2>Entra con Google</h2>
      <p>Agenda de casa. Solo adultos.</p>
      <button id="gate-sign-in" class="demo" type="button">Continuar con Google</button>
    </div>
  </section>
  <div id="app" hidden>
    <main class="wrap">
      <section class="days" id="days" aria-live="polite"><p style="padding:24px">Cargando…</p></section>
      <footer><span class="source">Fuente del tiempo: Open-Meteo</span><br>La página se actualiza sola al abrirla.<br>Creado por Álvaro GT y sus minions</footer>
    </main>
  </div>
<script src="/pie.js?v=20260930a"></script>
<script type="module">
  import { tripOn, tripLineText, tripSoon } from './trip_line.mjs?v=20260929a';
  import { menuDelDia } from './comedor.mjs?v=20260929a';
  import { formatPublicado } from './stamp.mjs?v=20260929a';
  import { nachoRopa } from './ropa.mjs?v=20260929a';
  import { fetchTiempo } from './tiempo.mjs?v=20260929a';
  import { eventsFromReglas, mergeEvents } from './reglas.mjs?v=20261007a';
  import { ymdInZone, nextYmd, weekYmds, nextWeekYmds, isFestivo } from './fechas.mjs?v=20260929a';
  import { lastVista, rememberVista, datesForVista, dayLabel, headingParts } from './vista.mjs?v=20260929a';
  const embedded=(()=>{try{return window.parent!==window&&window.parent.location.origin===location.origin}catch{return false}})();
  if(embedded)document.documentElement.classList.add('embedded');
  const houseName=()=>['Garc','ía ','Oliv','as'].join('');
  const paintHouse=on=>{
    document.title=on?houseName():'G.O.';
    const h=document.querySelector('header h1');
    if(!h)return;
    h.replaceChildren();
    if(on)h.append(houseName().slice(0,6),document.createElement('br'),houseName().slice(7));
    else h.textContent='G.O.';
  };
  const zone='Europe/Madrid';
  const clockFmt=new Intl.DateTimeFormat('es-ES',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function comedorBlock(payload,date){const platos=menuDelDia(payload,date);if(!platos)return `<div class="comedor"><p class="copy"><strong>Comedor</strong></p><p class="copy empty">Sin menú de comedor</p></div>`;return `<div class="comedor"><p class="copy"><strong>Comedor</strong></p><ul>${platos.map(p=>`<li>${safe(p)}</li>`).join('')}</ul></div>`}
  function card(day,label,viaje,comedor,vista){const rain=day.rain_probability==null?'':` · lluvia ${safe(day.rain_probability)}%`;const weather=day.min==null?'Previsión no disponible.':`${safe(day.min)}–${safe(day.max)} °C${rain}.`;const events=(day.events||[]).map(e=>{const clock=e.time?`<strong>${safe(e.time)}</strong> `:'';return `<li>${clock}${safe(e.title)}${e.location?` · ${safe(e.location)}`:''}</li>`}).join('');const nacho=day.nacho_ropa?`<p class="copy"><strong>Ropa: ${safe(day.nacho_ropa)}</strong></p>`:'';const festivo=day.festivo?`<p class="copy"><strong>Festivo</strong></p>`:'';const trip=viaje?tripLineText(viaje,day.date):'';const tripHtml=trip?`<p class="viaje">${safe(trip)}</p>`:'';const head=headingParts(vista,label,day.date);return `<article data-date="${safe(day.date)}"><div class="date">${safe(head.dateLine)}</div><h2 class="day-name">${safe(head.title)}</h2>${tripHtml}<p class="copy">${weather}</p>${festivo}${nacho}${comedorBlock(comedor,day.date)}<div class="activities">${events?`<ul>${events}</ul>`:'<span class="empty">No hay extraescolares apuntadas</span>'}</div></article>`}
  let fsApi=null, db=null, fsProject='tablongo', started=false, dayMap={}, viajesList=[], comedorPayload=null, todayYmd='';
  function parentEmail(){
    if(!embedded)return '';
    try{return String(window.parent.__casaAuth?.email?.()||'').toLowerCase()}catch{return ''}
  }
  async function parentIdToken(){
    if(!embedded)return null;
    try{return await window.parent.__casaAuth?.idToken?.()||null}catch{return null}
  }
  function parentOk(){if(!embedded)return false;try{return !!window.parent.__casaAuth?.ok?.()}catch{return false}}
  function notifyCasaHeight(){
    if(!embedded)return;
    const h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,400);
    try{window.parent.postMessage({casa:'frame-size',height:h},location.origin)}catch{}
  }
  async function casaDoc(id){
    if(fsApi&&db){
      try{
        const snap=await fsApi.getDoc(fsApi.doc(db,'casa_json',id));
        if(!snap.exists())throw Error('missing');
        const body=snap.data().body;
        if(typeof body!=='string')throw Error('body');
        return JSON.parse(body);
      }catch(err){
        if(!embedded)throw err;
      }
    }
    const token=await parentIdToken();
    if(!token)throw Error('missing');
    const res=await fetch(`https://firestore.googleapis.com/v1/projects/${fsProject}/databases/(default)/documents/casa_json/${encodeURIComponent(id)}`,{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(!res.ok)throw Error('missing');
    const body=(await res.json())?.fields?.body?.stringValue;
    if(typeof body!=='string')throw Error('body');
    return JSON.parse(body);
  }
  async function casaDocOpt(id){try{return await casaDoc(id)}catch{return null}}
  function calendarEvents(payload){
    const map={};
    if(!payload||payload.schema_version!==1||!Array.isArray(payload.days))return map;
    for(const day of payload.days){
      if(day&&typeof day.date==='string')map[day.date]=Array.isArray(day.events)?day.events:[];
    }
    return map;
  }
  function markVista(vista){
    document.querySelectorAll('.vista-switch [data-vista]').forEach(btn=>{
      btn.setAttribute('aria-pressed', btn.dataset.vista===vista ? 'true' : 'false');
    });
  }
  function renderDays(){
    const vista=lastVista();
    markVista(vista);
    const dates=datesForVista(vista,todayYmd);
    const days=dates.map(date=>dayMap[date]).filter(Boolean);
    const box=document.querySelector('#days');
    box.classList.toggle('is-week', vista!=='hoy');
    box.innerHTML=days.map(day=>card(day,dayLabel(vista,day.date,todayYmd),tripOn(viajesList,day.date),comedorPayload,vista)).join('');
    notifyCasaHeight();
    requestAnimationFrame(notifyCasaHeight);
    setTimeout(notifyCasaHeight,400);
  }
  function setTripSoonFlag(on){
    document.documentElement.setAttribute('data-trip-soon', on ? '1' : '0');
  }
  async function startApp(){
    if(started)return;
    started=true;
    document.querySelector('#app').hidden=false;
    document.querySelector('#gate').hidden=true;
    paintHouse(true);
    todayYmd=ymdInZone(new Date(),zone);
    const dates=[...weekYmds(todayYmd),...nextWeekYmds(todayYmd)];
    const [weather,data,reglas,viajesDoc,comedorDoc]=await Promise.all([
      fetchTiempo(),
      casaDocOpt('go_data'),
      casaDocOpt('go_reglas'),
      casaDocOpt('viajes'),
      casaDocOpt('go_comedor'),
    ]);
    viajesList=(viajesDoc&&viajesDoc.schema_version===1&&Array.isArray(viajesDoc.viajes))?viajesDoc.viajes:[];
    comedorPayload=(comedorDoc&&comedorDoc.schema_version===1&&comedorDoc.timezone===zone&&comedorDoc.dias&&typeof comedorDoc.dias==='object')?comedorDoc:null;
    const fromCal=calendarEvents(data);
    dayMap={};
    for(const date of dates){
      const w=(weather&&weather[date])||{};
      dayMap[date]={
        date,
        min:w.min??null,
        max:w.max??null,
        rain_probability:w.rain_probability??null,
        nacho_ropa:nachoRopa(date),
        festivo:isFestivo(date),
        events:mergeEvents(eventsFromReglas(reglas,date),fromCal[date]||[]),
      };
    }
    setTripSoonFlag(tripSoon(viajesList,todayYmd,nextYmd(todayYmd)));
    renderDays();
    try{
      const stamp=formatPublicado(data&&data.generated_at);
      if(stamp)document.querySelector('#updated').textContent=stamp;
    }catch{}
    notifyCasaHeight();
    requestAnimationFrame(notifyCasaHeight);
    setTimeout(notifyCasaHeight,400);
  }
  document.querySelector('.vista-switch')?.addEventListener('click',e=>{
    const btn=e.target.closest('[data-vista]');
    if(!btn)return;
    rememberVista(btn.dataset.vista);
    if(started)renderDays();
    else markVista(btn.dataset.vista);
  });
  markVista(lastVista());
  const tick=()=>document.querySelector('#clock').textContent=clockFmt.format(new Date());
  tick();setInterval(tick,1000);

  const status=document.querySelector('#google-status');
  const signIn=document.querySelector('#google-sign-in');
  const signOut=document.querySelector('#google-sign-out');
  const setStatus=text=>{status.textContent=text};
  const showGate=()=>{
    document.querySelector('#gate').hidden=false;
    document.querySelector('#app').hidden=true;
    started=false;
    signIn.hidden=false;
    signOut.hidden=true;
    paintHouse(false);
  };
  async function loadFirebaseConfig(){
    const cfg=await fetch('./firebase.public.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('cfg');return r.json()});
    if(typeof cfg.apiKey==='string'&&cfg.apiKey.startsWith('AIza'))return cfg;
    return fetch('/tablon/firebase.public.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('cfg');return r.json()});
  }
  async function setupGoogle(){
    if(!['localhost','127.0.0.1','alvarogt.com','www.alvarogt.com','tablongo.web.app','tablongo.firebaseapp.com'].includes(location.hostname)){
      setStatus('Acceso · dominio no autorizado');
      showGate();
      return;
    }
    try{
      const config=await loadFirebaseConfig();
      if(typeof config.projectId==='string'&&config.projectId)fsProject=config.projectId;
      const [{initializeApp},auth,firestore]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js')
      ]);
      const app=initializeApp(config);
      const service=auth.getAuth(app);
      await auth.setPersistence(service,auth.browserLocalPersistence);
      fsApi=firestore;
      db=firestore.getFirestore(app);
      const provider=new auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt:'select_account'});
      const houseAllowed=async()=>{try{await firestore.getDoc(firestore.doc(db,'casa_json','go_data'));return true}catch{return false}};
      const enter=async user=>{
        if(!(await houseAllowed())){
          auth.signOut(service);
          setStatus('Cuenta no autorizada');
          showGate();
          return;
        }
        setStatus(user.displayName||user.email);
        signIn.hidden=true;
        signOut.hidden=false;
        startApp();
      };
      const enterFromParent=()=>{
        if(!parentOk())return false;
        setStatus(parentEmail());
        signIn.hidden=true;
        signOut.hidden=true;
        startApp();
        return true;
      };
      auth.onAuthStateChanged(service,user=>{
        if(!user){
          if(enterFromParent())return;
          setStatus('Sin sesión');
          showGate();
          return;
        }
        void enter(user);
      });
      if(auth.authStateReady)await auth.authStateReady(service);
      if(!service.currentUser)enterFromParent();
      const login=async()=>{
        try{
          setStatus('Google · entrando…');
          await auth.signInWithPopup(service,provider);
        }catch(e){
          const code=e&&e.code;
          if(code==='auth/popup-blocked'||code==='auth/operation-not-supported-in-this-environment'){
            if(enterFromParent())return;
            try{
              await auth.signInWithRedirect(service,provider);
              return;
            }catch(redirectErr){
              setStatus('Google · '+(redirectErr.code||'error'));
              return;
            }
          }
          if(enterFromParent())return;
          setStatus('Google · '+(code||'error'));
        }
      };
      signIn.addEventListener('click',login);
      document.querySelector('#gate-sign-in').addEventListener('click',login);
      signOut.addEventListener('click',()=>auth.signOut(service));
    }catch(e){
      if(parentOk()){startApp();return}
      setStatus('Acceso · configuración no disponible');
      showGate();
    }
  }
  showGate();
  setupGoogle();
</script>
</body>
</html>
