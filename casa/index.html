<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1a1c17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casa">
  <title>Casa</title>
  <link rel="manifest" href="/casa/manifest.json">
  <link rel="apple-touch-icon" href="/casa/apple-touch-icon.png">
  <link rel="icon" href="/casa/icons/icon-192.png" sizes="192x192" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #11110f;
      --paper: #f4f0e8;
      --muted: #aaa99f;
      --line: #30332d;
      --card: #1a1c17;
      --accent: #ffb86b;
      --tabs-inner: 32px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: var(--card);
      color: var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { min-height: 100dvh; min-height: 100svh; }
    #gate[hidden], #shell[hidden], #session-overlay[hidden] { display: none !important; }
    #gate {
      min-height: 100dvh;
      background: var(--bg);
      display: grid;
      place-items: center;
      text-align: center;
      padding: calc(48px + env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px));
    }
    .kicker {
      font-size: .7rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--accent);
    }
    #gate h1 {
      font: 400 2.6rem/1 Georgia, serif;
      margin: 10px 0 12px;
    }
    #gate p {
      color: var(--muted);
      max-width: 420px;
      margin: 0 auto 22px;
      line-height: 1.55;
    }
    button.demo {
      padding: 11px 15px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--paper);
      background: transparent;
      font: inherit;
      font-size: .82rem;
      cursor: pointer;
    }
    button.demo:hover, button.demo:focus { background: var(--accent); color: var(--bg); }
    .access-status { color: var(--muted); font-size: .76rem; margin-top: 16px; }
    #shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100svh;
      padding-top: env(safe-area-inset-top, 0px);
      overflow: hidden;
      background: var(--card);
    }
    #scroller {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--tabs-inner) + env(safe-area-inset-bottom, 0px));
    }
    #scroller iframe {
      display: block;
      width: 100%;
      min-height: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    #tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      gap: 0;
      border-top: 1px solid var(--line);
      background: var(--card);
      padding-top: 2px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: max(8px, env(safe-area-inset-left, 0px));
      padding-right: max(8px, env(safe-area-inset-right, 0px));
    }
    #tabs button {
      position: relative;
      flex: 1 1 0;
      margin: 0;
      min-height: var(--tabs-inner);
      padding: 5px 8px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font: 600 .78rem/1.15 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    #tabs button[aria-selected="true"] {
      background: var(--paper);
      color: var(--bg);
    }
    .tab-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-left: 5px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
    }
    .tab-dot[hidden] { display: none !important; }
    #session-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      background: rgba(17, 17, 15, 0.55);
      padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body>
  <section id="gate">
    <div>
      <div class="kicker">Casa · García Olivas</div>
      <h1>Entra con Google</h1>
      <p>Entra aquí, dentro del icono. Lo de Safari no vale.</p>
      <button id="gate-sign-in" class="demo" type="button">Continuar con Google</button>
      <p id="google-status" class="access-status">Acceso · comprobando</p>
    </div>
  </section>
  <div id="shell" hidden>
    <div id="scroller"></div>
    <nav id="tabs" aria-label="Secciones de casa">
      <button type="button" data-view="go" aria-selected="true">Go</button>
      <button type="button" data-view="tablon" aria-selected="false">Tablón<span class="tab-dot" hidden aria-hidden="true"></span></button>
      <button type="button" data-view="viajes" aria-selected="false">Viajes</button>
    </nav>
  </div>
  <div id="session-overlay" hidden>
    <button id="session-reenter" class="demo" type="button">Sesión caducada · Entrar de nuevo</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
