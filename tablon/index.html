<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Tablón familiar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="shell topbar">
    <div><p class="eyebrow">Casa · tablón familiar</p><h1>Tablón</h1></div>
    <div class="session"><span id="mode-badge" class="badge">Comprobando acceso…</span><button id="sign-in" class="button secondary hidden">Entrar</button><button id="sign-out" class="button secondary hidden">Salir</button></div>
  </header>
  <main class="shell">
    <section id="access-message" class="notice hidden"></section>
    <section id="app" class="hidden">
      <div class="summary" aria-label="Resumen"><article><strong id="pending-count">0</strong><span>Pendientes</span></article><article><strong id="done-count">0</strong><span>Hechas esta frecuencia</span></article><article><strong id="points-total">0</strong><span>Puntos acumulados</span></article></div>
      <nav class="tabs" aria-label="Vista"><button class="tab active" data-view="adult">Adultos</button><button class="tab" data-view="nacho">Nacho</button><button class="tab" data-view="luz">Luz</button></nav>
      <section id="adult-view" class="view">
        <div class="section-head"><div><p class="eyebrow">Gestión</p><h2>Tareas</h2></div><button id="new-task" class="button primary">Nueva tarea</button></div>
        <form id="task-form" class="panel form hidden" novalidate>
          <h3 id="form-title">Nueva tarea</h3><input type="hidden" id="task-id">
          <label>Título<input id="title" name="title" maxlength="120" required autocomplete="off"></label>
          <div class="form-grid"><label>Para<select id="assignee"><option value="Nacho">Nacho</option><option value="Luz">Luz</option><option value="shared">Compartida</option></select></label><label>Frecuencia<select id="frequency"><option value="daily">Diaria</option><option value="weekly">Semanal</option></select></label><label>Puntos<input id="points" type="number" min="0" max="1000" step="1" value="0" required></label><label class="check"><input id="requires-validation" type="checkbox" checked> Requiere validación adulta</label></div>
          <fieldset id="days-field"><legend>Días de la semana (para semanal)</legend><div class="days"><label><input type="checkbox" value="1"> Lun</label><label><input type="checkbox" value="2"> Mar</label><label><input type="checkbox" value="3"> Mié</label><label><input type="checkbox" value="4"> Jue</label><label><input type="checkbox" value="5"> Vie</label><label><input type="checkbox" value="6"> Sáb</label><label><input type="checkbox" value="0"> Dom</label></div></fieldset>
          <label>Estado<select id="task-state"><option value="active">Activa</option><option value="paused">Pausada</option><option value="archived">Archivada</option></select></label>
          <div class="form-actions"><button type="submit" class="button primary">Guardar</button><button type="button" id="cancel-form" class="button secondary">Cancelar</button></div><p id="form-error" class="error" role="alert"></p>
        </form>
        <div id="adult-task-list" class="task-list"></div>
      </section>
      <section id="nacho-view" class="view hidden"><div class="section-head"><div><p class="eyebrow">Vista de Nacho</p><h2>Mis tareas</h2></div><strong class="points-label">⭐ <span id="nacho-points">0</span> puntos</strong></div><div id="nacho-task-list" class="task-list"></div></section>
      <section id="luz-view" class="view hidden"><div class="section-head"><div><p class="eyebrow">Vista de Luz</p><h2>Mis tareas</h2></div><strong class="points-label">⭐ <span id="luz-points">0</span> puntos</strong></div><div id="luz-task-list" class="task-list"></div></section>
      <section class="panel history"><div class="section-head"><h2>Historial</h2><button id="refresh" class="button secondary">Actualizar</button></div><div id="history-list"></div></section>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
