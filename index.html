  <style>
    :root { color-scheme: dark; --ink:#f4f0e8; --bg:#11110f; }

    html, body { margin:0; min-height:100%; }
    body { min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 70% 20%, #292721 0, var(--bg) 42%), var(--bg); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; }
    h1 { margin:0; width:min(92vw,1100px); font-size:clamp(4.5rem,16vw,13rem); line-height:.82; letter-spacing:-.085em; font-weight:400; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

    .home-links a:hover,.home-links a:focus { opacity:1; background:#f4f0e8; color:var(--bg) }
    #oso-egg[hidden] { display:none !important; }
    #oso-egg { position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); z-index:0; display:flex; flex-direction:column; align-items:center; gap:6px; margin:0; padding:8px; border:0; background:transparent; color:var(--ink); font:500 .85rem/1.2 Georgia, 'Times New Roman', serif; cursor:pointer; }
    #oso-egg svg { display:block; width:22px; height:24px; }
  </style>
</head>
