<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Álvaro GT</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f0e8; --bg:#11110f; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 70% 20%, #292721 0, var(--bg) 42%), var(--bg); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; }
    h1 { margin:0; width:min(92vw,1100px); font-size:clamp(4.5rem,16vw,13rem); line-height:.82; letter-spacing:-.085em; font-weight:400; }
    footer { position:fixed; left:16px; bottom:16px; right:210px; text-align:left; font-size:.78rem; color:#c9c4b8; }
    .home-links { position:fixed; right:16px; bottom:16px; display:flex; gap:8px; z-index:1; }
    .home-links a { padding:6px 10px; border:1px solid #8a867c; border-radius:999px; color:var(--ink); font:500 .72rem/1 ui-sans-serif,system-ui,-apple-system,sans-serif; text-decoration:none; opacity:.85 }
    .home-links a:hover,.home-links a:focus { opacity:1; background:#f4f0e8; color:var(--bg) }
  </style>
</head>
<body>
  <h1>Álvaro<br>GT</h1>
  <footer>Creado por Álvaro GT y sus minions</footer>
  <nav class="home-links" aria-label="Sitios de casa">
    <a href="/go/">Go</a>
    <a href="/viajes/">Viajes</a>
    <a href="/tablon/">Tablón</a>
  </nav>
</body>
</html>
