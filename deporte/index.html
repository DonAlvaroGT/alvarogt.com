<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Deporte</title>
  <!-- deporte-build: 20261016d -->
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1c17;
      --muted: #6b6a62;
      --paper: #f4f0e8;
      --accent: #c45c26;
      --line: #ddd6c6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { width: min(520px, calc(100% - 32px)); margin: auto; padding: 48px 0 40px; text-align: center; }
    .eyebrow { color: var(--accent); font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font: 400 clamp(2.4rem, 8vw, 4.2rem)/.9 Georgia, serif; margin: 0 0 16px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 28px; }
    footer { color: var(--muted); font-size: .72rem; border-top: 1px solid var(--line); padding: 18px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Casa</p>
    <h1>Deporte</h1>
    <p>No disponible.</p>
    <footer>Creado por Álvaro GT y sus minions</footer>
  </div>
</body>
</html>
